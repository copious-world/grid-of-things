
  <div class="grid-card" onclick="view_from_blog_entries(event,{{data.id}})" >
      <div class="grid-card-stats">
        <input type="checkbox" class="blg_list_check_select" value="{{data.id}}" onchange="update_check_box_pattern(event)" />
        <span class="thng-score">{{data.score}}</span>
        <span class="thng-created">{{data.created_when}}</span>
        <span class="thng-updated">{{data.updated_when}}</span>
      </div>

      <h3 class="card-title">{{data.subject}}</h3>
      <div class="teaser">
        <p class="card-desc">{{data.description}}</p>
      </div>
      <h6>{{data.keys}}</h6>
  </div>
